name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # The example database is the default so that every step added below is
    # correct without remembering to set it. Only the package's own integration
    # tests want `starter_test`, and only that one step overrides.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/example_e2e
      PACKAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/starter_test
      BETTER_AUTH_SECRET: ci-secret-must-be-thirty-two-chars-or-more
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: ""
      EMAIL_FROM: auth@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck (package)
        run: npm run typecheck

      - name: Test (package)
        run: npm test
        env:
          DATABASE_URL: ${{ env.PACKAGE_TEST_DATABASE_URL }}

      - name: Check migrations are in sync with schema
        run: npm run db:check:auth

      - name: Build (package)
        run: npm run build

      - name: Typecheck (example)
        run: npm --workspace examples/basic run typecheck

      # The package's integration tests own `starter_test` outright — they drop
      # and recreate the auth tables. Give the example its own database so the
      # two never have to agree on who leaves what behind.
      - name: Create the example database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE example_e2e'

      - name: Apply auth migrations (package-owned track)
        run: npm --workspace examples/basic run db:migrate

      - name: Install Playwright browser
        run: npx --workspace examples/basic playwright install --with-deps chromium

      - name: E2E smoke test
        run: npm --workspace examples/basic run test:e2e

  # The suite above runs on 22 because vitest 5 requires it. vitest is a
  # devDependency; `engines` still promises the published package runs on Node
  # 20, and an unproven promise is the kind that breaks quietly — a Node 22-only
  # API in `src/` or `bin/` would publish green and crash the first time a
  # consumer on 20 ran `next-starter migrate`. So build and run exactly that on
  # 20. No vitest here, which is the only thing that needs the newer runtime.
  node20:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/node20_cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build (package)
        run: npm run build

      - name: Create the database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE node20_cli'

      - name: Run the migrate CLI on Node 20
        run: node bin/cli.mjs migrate
